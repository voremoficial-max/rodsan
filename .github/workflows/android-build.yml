name: Android CI - Build Release APK

# Se ejecuta en cada push o pull request a la rama main,
# y tambien se puede lanzar manualmente desde la pestana "Actions".
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar y probar RodSan
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el codigo del repositorio
      - name: Descargar codigo
        uses: actions/checkout@v4

      # 2. Configura Java 17 (requerido por AGP 8.5.2)
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Instala Gradle 8.7 y habilita cache de dependencias.
      #    No dependemos del binario gradle-wrapper.jar del repositorio:
      #    esta accion provee el comando "gradle" listo para usarse.
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 4. Ejecuta las pruebas unitarias
      - name: Ejecutar pruebas unitarias
        run: gradle testDebugUnitTest --stacktrace

      # 5. Prepara el keystore privado desde los secretos de GitHub.
      - name: Preparar firma de lanzamiento
        env:
          KEYSTORE_BASE64: ${{ secrets.RODSAN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Falta el secreto RODSAN_KEYSTORE_BASE64."
            echo "Configura los 4 secretos indicados en el README antes de compilar el release firmado."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > rodsan-release.keystore

      # 6. Compila el APK Release firmado.
      - name: Compilar APK Release firmado
        env:
          RODSAN_KEYSTORE_PATH: ${{ github.workspace }}/rodsan-release.keystore
          RODSAN_KEYSTORE_PASSWORD: ${{ secrets.RODSAN_KEYSTORE_PASSWORD }}
          RODSAN_KEY_ALIAS: ${{ secrets.RODSAN_KEY_ALIAS }}
          RODSAN_KEY_PASSWORD: ${{ secrets.RODSAN_KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleRelease --stacktrace

      # 7. Renombra el archivo final para que no se llame app-debug.apk/app-release.apk.
      - name: Preparar RodSan.apk
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/RodSan.apk

      # 8. Sube el APK final como Artifact descargable
      - name: Subir APK RodSan
        uses: actions/upload-artifact@v4
        with:
          name: RodSan-release
          path: app/build/outputs/apk/release/RodSan.apk
          if-no-files-found: error
